<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JO-TAP | 培訓簽到現場廣播系統</title>
  <link rel="stylesheet" href="style.css">
  <!-- 採用全球最穩定、零外部依賴的原生 QR 生成庫 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
</head>
<body>

<div class="card">
  <header>
    <div>
      <h1 id="i18n-header-title">東淦工程 · 現場簽到廣播系統</h1>
      <span class="badge" id="i18n-badge">內部試點 (限額 100 人)</span>
    </div>
    <!-- 雙語切換開關 -->
    <div class="lang-switch">
      <button type="button" class="btn-lang active" onclick="switchLanguage('zh')">繁中</button>
      <button type="button" class="btn-lang" onclick="switchLanguage('en')">EN</button>
    </div>
  </header>

  <div class="grid">
    <!-- 設定面版 -->
    <div class="controls" id="setupPanel">
      <div class="form-group">
        <label for="trainingTitle" id="i18n-lbl-title">培訓課程名稱</label>
        <input type="text" id="trainingTitle" placeholder="例如：高空工作安全訓練" required>
      </div>

      <div class="form-group">
        <label for="trainerName" id="i18n-lbl-trainer">主講者姓名</label>
        <input type="text" id="trainerName" placeholder="例如：陳大文" required>
      </div>

      <div class="form-group">
        <label for="trainerEmailPrefix" id="i18n-lbl-email">主講者公司電郵前綴</label>
        <div class="email-box">
          <!-- 徹底清除 jackylaw 預設字樣 -->
          <input type="text" id="trainerEmailPrefix" placeholder="trainer.name" required>
          <span>@jumboorient.com.hk</span>
        </div>
      </div>

      <button class="btn-primary" id="i18n-btn-start" onclick="startSession()">🚀 一鍵生成並全螢幕投影</button>
    </div>

    <!-- 投影顯示區 -->
    <div class="display-box" id="displayBox">
      <div id="idleView">
        <p style="color: var(--text-muted); font-size: 14px;" id="i18n-idle-text">填妥左側資料後<br>點擊按鈕直接開啟投影</p>
      </div>

      <div id="activeView" style="display: none; width: 100%;">
        <div class="session-tag" id="lblSession">TRN-XXXX</div>
        <h2 id="lblTitle" style="font-size: 22px; margin-bottom: 8px;">培訓主題</h2>
        
        <!-- QR Code 容器 -->
        <div id="qrcode-box"></div>
        
        <p style="font-size: 14px; font-weight: 600;" id="i18n-scan-hint">請使用手機相機掃描 QR Code 登記出席</p>
        
        <p class="privacy-text" id="i18n-privacy-text">
          【個資聲明】本簽到僅限東淦內部出勤核對與 HRF-043 存檔，受公司資訊政策嚴密保護。
        </p>

        <div class="action-links">
          <button onclick="executeFullscreen()" id="i18n-btn-fs">全螢幕投影 (F11)</button>
          <button onclick="openFallbackModal()" id="i18n-btn-planb">現場手動補簽 (Plan B)</button>
          <button onclick="endSession()" style="color: #dc2626;" id="i18n-btn-end">結束本場培訓</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Plan B 彈窗 -->
<div class="modal" id="fallbackModal">
  <div class="modal-content">
    <h3 style="margin-bottom: 8px; font-size: 16px;" id="i18n-modal-title">現場手動代簽 (Plan B)</h3>
    <p style="font-size: 12px; color: #6b7280; margin-bottom: 12px;" id="i18n-modal-desc">
      當前場次：<strong id="modalSessionId"></strong><br>
      資料將自動注入微軟後端流水線，確保與現場簽到即時合流。
    </p>
    
    <div class="form-group">
      <input type="text" id="manualStaffNo" placeholder="職員編號 (Staff ID)">
    </div>
    <div class="form-group">
      <input type="text" id="manualStaffName" placeholder="中文姓名 (Full Name)">
    </div>

    <button class="btn-primary" id="i18n-modal-submit" onclick="submitRealPlanB()">開啟代登分頁並送出</button>
    <button onclick="closeFallbackModal()" style="width: 100%; background: none; border: none; margin-top: 10px; font-size: 13px; color: #6b7280; cursor: pointer;" id="i18n-modal-cancel">取消</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
